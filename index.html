<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tints Safari's collapsing chrome (the band under the home
         indicator) with the site's cream instead of the default grey. -->
    <meta name="theme-color" content="#f4f1ea" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Type direction: Fraunces (variable optical axis up to 144pt — hairline
      contrast at display size, soft artisanal terminals) carries the brand
      serif; Archivo's variable width axis (62..125) supplies the extended
      geometric "tech" layer for the STUDIO eyebrow. Two files, both
      variable, replacing Playfair.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Archivo:wdth,wght@62..125,300..700&display=swap"
      rel="stylesheet"
    />
    <title>Césure — Studio digital</title>
  </head>
  <body>
    <!-- First-paint shield: the intro demands a screen that is black from
         the very first byte, before React or any bundle arrives. The
         Preloader component removes it the moment it takes over (and
         immediately under reduced motion / ?nointro). -->
    <div id="intro-shield" style="position: fixed; inset: 0; z-index: 1000; background: #000"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
